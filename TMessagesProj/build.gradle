apply plugin: 'com.android.application'

repositories {
    maven { url 'https://maven.google.com' }
    mavenCentral()
    maven { url "https://jitpack.io" }
    jcenter()
}

configurations {
    all {
        exclude group: 'androidx.appcompat', module: 'appcompat'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-identifier'
        resolutionStrategy {
            force 'com.google.android.gms:play-services-basement:10.2.0'
            force 'com.google.android.gms:play-services-base:10.2.0'
            force 'com.google.android.gms:play-services-gcm:10.2.0'
            force 'com.google.android.gms:play-services-maps:10.2.0'
            force 'com.google.android.gms:play-services-location:10.2.0'
            force 'com.google.android.gms:play-services-vision:10.2.0'
        }
    }
}

dependencies {
    compile 'com.google.android.gms:play-services-basement:10.2.0'
    compile 'com.google.android.gms:play-services-base:10.2.0'
    compile 'com.google.android.gms:play-services-gcm:10.2.0'
    compile 'com.google.android.gms:play-services-maps:10.2.0'
    compile 'com.google.android.gms:play-services-vision:10.2.0'
    compile 'com.android.support:support-core-ui:25.3.1'
    compile 'com.android.support:support-compat:25.3.1'
    compile 'com.android.support:support-core-utils:25.3.1'
    compile 'com.android.support:support-v13:25.3.1'
    compile 'com.android.support:palette-v7:25.3.1'
    compile 'net.hockeyapp.android:HockeySDK:4.1.2'
    compile 'com.googlecode.mp4parser:isoparser:1.0.6'
    compile 'com.stripe:stripe-android:2.0.2'

    // Adel
    compile 'com.android.support:multidex:1.0.1'
    compile 'com.android.support:design:25.3.1'
    compile 'com.android.support:cardview-v7:25.3.1'
    compile files('libs/android-viewbadger.jar')
    compile files('libs/ksoap2-android-assembly-3.1.1-jar-with-dependencies.jar')
    compile 'com.android.support:support-v4:25.3.1'
    compile 'com.android.support:customtabs:25.3.1'
    compile 'com.google.android.gms:play-services-location:10.2.0'
    compile ('com.onesignal:OneSignal:3.15.6') {
        exclude group: 'com.android.support', module: 'customtabs'
        exclude group: 'com.google.android.gms', module: 'play-services-gcm'
        exclude group: 'com.google.android.gms', module: 'play-services-location'
    }
    // Download, Catch, Etc... Images
    compile 'com.squareup.picasso:picasso:2.5.2'
}

android {
    compileSdkVersion 28
    buildToolsVersion '28.0.3'
    flavorDimensions "abi"

    useLibrary 'org.apache.http.legacy'
    defaultConfig.applicationId = "com.silverdesign.rosegram"
    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }

    dexOptions {
        jumboMode = true
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    signingConfigs {
        debug {
            storeFile file("config/release.keystore")
            storePassword "PASSWORD"
            keyAlias "KEY"
            keyPassword "PASSWORD"
            v2SigningEnabled false
        }

        release {
            storeFile file("config/release.keystore")
            storePassword "PASSWORD"
            keyAlias "KEY"
            keyPassword "PASSWORD"
            v2SigningEnabled false
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        foss {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
        }
    }

    defaultConfig.versionCode = 5007

    sourceSets.debug {
        manifest.srcFile 'config/debug/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile 'config/release/AndroidManifest.xml'
    }

    sourceSets.foss {
        manifest.srcFile 'config/foss/AndroidManifest.xml'
    }

    productFlavors {
        x86 {
            dimension "abi"
            ndk {
                abiFilters "x86"
            }
            versionCode = 2
        }
        armv7 {
            dimension "abi"
            ndk {
                abiFilters "armeabi-v7a"
            }
            versionCode = 1
        }
        x86_SDK23 {
            dimension "abi"
            ndk {
                abiFilters "x86"
            }
            sourceSets.debug {
                manifest.srcFile 'config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile 'config/release/AndroidManifest_SDK23.xml'
            }
            minSdkVersion 23
            versionCode = 4
        }
        armv7_SDK23 {
            dimension "abi"
            ndk {
                abiFilters "armeabi-v7a"
            }
            sourceSets.debug {
                manifest.srcFile 'config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile 'config/release/AndroidManifest_SDK23.xml'
            }
            minSdkVersion 23
            versionCode = 3
        }
        fat {
            dimension "abi"
            sourceSets.debug {
                manifest.srcFile 'config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile 'config/release/AndroidManifest_SDK23.xml'
            }
            versionCode = 5
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.versionCodeOverride = defaultConfig.versionCode
        }
    }

    defaultConfig {
        minSdkVersion 15
        targetSdkVersion 25
        versionName "3.18.0.7"
        multiDexEnabled true
        manifestPlaceholders = [
                onesignal_app_id: "00000000-0000-0000-0000-000000000000",
                onesignal_google_project_number: "REMOTE"
        ]

        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK:=jni/Application.mk", "APP_PLATFORM:=android-14"
                abiFilters "armeabi-v7a", "x86"
            }
        }
    }
}

apply plugin: 'com.google.gms.google-services'
